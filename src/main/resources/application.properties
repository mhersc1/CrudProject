#===============================================
# Quarkus Application Configuration
#===============================================

# Set the HTTP port for the application to use
quarkus.http.port=8080

#===============================================
# SmallRye JWT Settings
#===============================================
# Public key for verifying JWT signatures  
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://example.com/issuer

# For automated demonstration purposes without managing external certificate keystores,
# we instruct smallrye to expect signed tokens matching our quick sign setup.
smallrye.jwt.sign.key.location=privateKey.pem

#===============================================
# Quarkus Testing Configuration
#===============================================
# Turn off live reloading for tests (faster test runs)
quarkus.test.continuous-testing=disabled

# Turn off development services like testcontainers, etc during tests
quarkus.devservices.enabled=false

# Prevents Quarkus dev mode from generating default HTML/JSON stack traces for uncaught errors
quarkus.html.error-pages=false

#===============================================
# Database Settings (DISABLED - Using Pure In-Memory)
#===============================================
# NOTE: Using true in-memory storage, no database needed
# quarkus.datasource.db-kind=h2
# quarkus.datasource.username=sa
# quarkus.datasource.password=
# quarkus.datasource.jdbc.url=jdbc:h2:mem:product_db
# quarkus.hibernate-orm.database.generation=drop-and-create
# quarkus.hibernate-orm.log.sql=true

#===============================================
# Logging Configuration
#===============================================
# Set the default console log level (INFO, DEBUG, or TRACE)
quarkus.log.console.level=DEBUG

# Enable HTTP Request/Response logging (Shows every path hit in real-time)
quarkus.http.access-log.category=io.quarkus.http.access-log
quarkus.http.access-log.enabled=true
quarkus.log.category."io.quarkus.http.access-log".level=INFO

# Turn on Security and JWT Debugging (Crucial for seeing why a token passes or fails)
quarkus.log.category."io.quarkus.security".level=DEBUG
quarkus.log.category."io.smallrye.jwt".level=DEBUG

# RESTEasy Reactive endpoint routing details (duplicate lines shown)
quarkus.log.category."io.quarkus.resteasy.reactive".level=DEBUG
quarkus.log.category."io.quarkus.resteasy.reactive".level=DEBUG

#===============================================
# GraphQL Configuration
#===============================================
quarkus.smallrye-graphql.enabled=true
quarkus.smallrye-graphql.schema-auto-discovery=true
quarkus.smallrye-graphql.print-data-fetcher-exception=true
quarkus.smallrye-graphql.error-extension-fields=all

# Enable GraphQL UI for development (GraphiQL)
quarkus.smallrye-graphql.ui.enable=true
