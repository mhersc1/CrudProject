}

input ProductInput {
  name: String!
  price: Float!
}

enum ProductSortField {
  ID
  NAME
  PRICE
}

enum SortDirection {
  ASC
  DESC
}

type Query {
  product(id: ID!): Product
  products: [Product!]!
  productsWithFilter(filter: ProductFilter, sort: ProductSort, pagination: Pagination): ProductConnection!
  me: User!
